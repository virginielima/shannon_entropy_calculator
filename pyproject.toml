[project]
name = "shannon-entropy-calculator"
version = "0.1.0"
description = "Shannon entropy calculator that treats each Unicode code point as a single symbol"
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
